<section class="form-container">
  <h2>Registrar nueva cita</h2>

  <form (ngSubmit)="onSubmit()" #citaForm="ngForm">
    <div class="grid">
      <label>
        <span>Paciente ID</span>
        <input
          type="number"
          [(ngModel)]="form.pacienteId"
          name="pacienteId"
          required
        />
      </label>

      <label>
        <span>Doctor ID</span>
        <input
          type="number"
          [(ngModel)]="form.doctorId"
          name="doctorId"
          required
        />
      </label>

      <label>
        <span>Prioridad</span>
        <select
          [(ngModel)]="form.nivelPrioridad"
          name="nivelPrioridad"
          required>
          <option value="ALTA">ALTA</option>
          <option value="MEDIA">MEDIA</option>
          <option value="BAJA">BAJA</option>
        </select>
      </label>

      <label>
        <span>Fecha y hora</span>
        <input
          type="datetime-local"
          [(ngModel)]="form.fechaCita"
          name="fechaCita"
          required
        />
      </label>

      <label class="full">
        <span>Motivo de consulta</span>
        <textarea
          [(ngModel)]="form.motivoConsulta"
          name="motivoConsulta"
          rows="4"
          required>
        </textarea>
      </label>

      <label>
        <span>Monto consulta</span>
        <input
          type="number"
          step="0.01"
          min="0"
          [(ngModel)]="form.montoConsulta"
          name="montoConsulta"
          required
        />
      </label>
    </div>

    @if (mensaje()) {
      <p class="mensaje">{{ mensaje() }}</p>
    }

    <button
      type="submit"
      [disabled]="enviando() || !citaForm.valid">
      {{ enviando() ? 'Guardando...' : 'Guardar cita' }}
    </button>
  </form>
</section>
